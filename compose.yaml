services:
  app:
    image: kholerohit/mlops-dvc-app:latest
    environment:
      DAGSHUB_USER_TOKEN: ${DAGSHUB_USER_TOKEN:-}
    expose:
      - "8000"
    volumes:
      - model-artifacts:/app/artifacts
    networks:
      - application
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    security_opt:
      - no-new-privileges:true

  nginx:
    image: nginxinc/nginx-unprivileged:stable-alpine
    ports:
      - "${APP_PORT:-8080}:8080"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - application
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    security_opt:
      - no-new-privileges:true

networks:
  application:
    driver: bridge

volumes:
  model-artifacts: