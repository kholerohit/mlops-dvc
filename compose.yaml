services:
  app:
    image: kholerohit/mlops-dvc-app:latest
    environment:
      DAGSHUB_USER_TOKEN: ${DAGSHUB_USER_TOKEN:?Set DAGSHUB_USER_TOKEN in .env}
    expose:
      - "8000"
    volumes:
      - model-artifacts:/app/artifacts
    networks:
      - application
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    security_opt:
      - no-new-privileges:true

  nginx:
    image: nginxinc/nginx-unprivileged:stable-alpine
    ports:
      - "${APP_PORT:-8080}:8080"
    configs:
      - source: nginx-default-conf
        target: /etc/nginx/conf.d/default.conf
    networks:
      - application
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    security_opt:
      - no-new-privileges:true

networks:
  application:
    driver: bridge

volumes:
  model-artifacts:

configs:
  nginx-default-conf:
    content: |
      server {
          listen 8080;
          server_name _;
          server_tokens off;

          client_max_body_size 1m;

          location / {
              resolver 127.0.0.11 valid=30s ipv6=off;
              set $$app_upstream http://app:8000;
              proxy_pass $$app_upstream;
              proxy_http_version 1.1;
              proxy_set_header Host $$host;
              proxy_set_header X-Real-IP $$remote_addr;
              proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $$scheme;
              proxy_connect_timeout 5s;
              proxy_read_timeout 120s;
          }
      }