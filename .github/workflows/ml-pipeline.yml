name: ML pipeline CI

on:
  push:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-docker.txt

      - name: Install runtime dependencies
        run: python -m pip install -r requirements-docker.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v


  pipeline-validation:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-docker.txt

      - name: Install runtime dependencies
        run: python -m pip install -r requirements-docker.txt

      - name: Run complete pipeline without external tracking
        env:
          MLFLOW_TRACKING_ENABLED: "false"
        run: python demo.py

  track-main:
    needs:
      - test
      - pipeline-validation
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-docker.txt

      - name: Install runtime dependencies
        run: python -m pip install -r requirements-docker.txt

      - name: Run pipeline and log to DagsHub after merge to main
        env:
          DAGSHUB_USER_TOKEN: ${{ secrets.DAGSHUB_USER_TOKEN }}
        run: |
          if [ -z "$DAGSHUB_USER_TOKEN" ]; then
            echo "Set the DAGSHUB_USER_TOKEN repository secret before merging to main."
            exit 1
          fi
          python demo.py